<script>
  let currentUser = null;
  let currentPartySession = null;

  let APP_DATA = {
    staffUsers: [],
    agreements: [],
    inwards: [],
    dispatches: []
  };

  // ---------------------------------------------------------
  // HELPERS
  // ---------------------------------------------------------

  function normalizePhone(value) {
    if (!value) return "";

    let phone = String(value).replace(/\D/g, "");

    // Convert +91XXXXXXXXXX / 91XXXXXXXXXX to XXXXXXXXXX
    if (phone.length === 12 && phone.startsWith("91")) {
      phone = phone.substring(2);
    }

    return phone;
  }

  function normalizeUsername(value) {
    return String(value || "")
      .trim()
      .toLowerCase()
      .replace(/^@/, "");
  }

  function todayDate() {
    return new Date().toISOString().split("T")[0];
  }

  function updateCloudBadge(text, type = "normal") {
    const badge = document.getElementById("cloud-status-badge");
    if (!badge) return;

    badge.innerText = text;

    if (type === "success") {
      badge.className =
        "mb-5 inline-block text-[10px] px-2.5 py-0.5 rounded-full font-bold bg-emerald-100 text-emerald-800";
    } else if (type === "error") {
      badge.className =
        "mb-5 inline-block text-[10px] px-2.5 py-0.5 rounded-full font-bold bg-red-100 text-red-800";
    } else {
      badge.className =
        "mb-5 inline-block text-[10px] px-2.5 py-0.5 rounded-full font-bold bg-amber-100 text-amber-800";
    }
  }

  // ---------------------------------------------------------
  // FIRESTORE
  // ---------------------------------------------------------

  async function loadCloudData() {
    try {
      updateCloudBadge("☁️ Connecting to Cloud...");

      const snap = await db
        .collection("plant_data")
        .doc("main_state")
        .get();

      if (snap.exists) {
        const cloudData = snap.data() || {};

        APP_DATA = {
          staffUsers: Array.isArray(cloudData.staffUsers)
            ? cloudData.staffUsers
            : [],

          agreements: Array.isArray(cloudData.agreements)
            ? cloudData.agreements
            : [],

          inwards: Array.isArray(cloudData.inwards)
            ? cloudData.inwards
            : [],

          dispatches: Array.isArray(cloudData.dispatches)
            ? cloudData.dispatches
            : []
        };

        localStorage.setItem(
          "SETIA_WAXING_PORTAL_V10",
          JSON.stringify(APP_DATA)
        );

        updateCloudBadge("☁️ Firebase Cloud Sync Active", "success");

        console.log("CLOUD DATA LOADED:", APP_DATA);

        return true;
      }

      // If no document exists, create it
      await db
        .collection("plant_data")
        .doc("main_state")
        .set(APP_DATA);

      updateCloudBadge("☁️ Firebase Cloud Sync Active", "success");

      return true;

    } catch (error) {
      console.error("FIRESTORE LOAD ERROR:", error);

      updateCloudBadge(
        "❌ Cloud connection failed",
        "error"
      );

      return false;
    }
  }

  // ---------------------------------------------------------
  // REAL-TIME CLOUD LISTENER
  // ---------------------------------------------------------

  function setupCloudListeners() {

    db.collection("plant_data")
      .doc("main_state")
      .onSnapshot(
        (doc) => {

          if (!doc.exists) {
            console.log("main_state does not exist.");
            return;
          }

          const data = doc.data() || {};

          APP_DATA = {
            staffUsers: Array.isArray(data.staffUsers)
              ? data.staffUsers
              : [],

            agreements: Array.isArray(data.agreements)
              ? data.agreements
              : [],

            inwards: Array.isArray(data.inwards)
              ? data.inwards
              : [],

            dispatches: Array.isArray(data.dispatches)
              ? data.dispatches
              : []
          };

          localStorage.setItem(
            "SETIA_WAXING_PORTAL_V10",
            JSON.stringify(APP_DATA)
          );

          updateCloudBadge(
            "☁️ Firebase Cloud Sync Active",
            "success"
          );

          renderDashboard();
          renderStaffTable();

          console.log("REAL-TIME CLOUD UPDATE:", APP_DATA);
        },

        (error) => {
          console.error("Firestore listener error:", error);

          updateCloudBadge(
            "❌ Firestore read failed",
            "error"
          );
        }
      );
  }

  // ---------------------------------------------------------
  // SAVE DATA
  // ---------------------------------------------------------

  async function saveData() {

    localStorage.setItem(
      "SETIA_WAXING_PORTAL_V10",
      JSON.stringify(APP_DATA)
    );

    try {

      await db
        .collection("plant_data")
        .doc("main_state")
        .set(APP_DATA);

      console.log("DATA SUCCESSFULLY SAVED TO FIRESTORE");

      renderDashboard();
      renderStaffTable();

      return true;

    } catch (error) {

      console.error("CLOUD WRITE FAILED:", error);

      alert(
        "⚠️ Cloud save failed.\n\n" +
        "Your data may only be saved on this device.\n\n" +
        error.message
      );

      return false;
    }
  }

  async function forceSyncToCloud() {

    const success = await saveData();

    if (success) {
      alert("✅ All records successfully pushed to Cloud Firestore!");
    }
  }

  // ---------------------------------------------------------
  // LOGIN
  // ---------------------------------------------------------

  async function handleUniversalLogin(e) {

    e.preventDefault();

    const rawU =
      document.getElementById("login-user").value.trim();

    const password =
      document.getElementById("login-pass").value.trim();

    const username =
      normalizeUsername(rawU);

    const phone =
      normalizePhone(rawU);

    const btn =
      document.getElementById("btn-login-submit");

    btn.innerText = "Connecting to Cloud...";
    btn.disabled = true;

    try {

      // ALWAYS GET FRESH DATA FROM FIRESTORE
      const cloudOK = await loadCloudData();

      if (!cloudOK) {

        alert(
          "❌ Unable to connect to the cloud database.\n\n" +
          "Please check your internet connection and Firebase settings."
        );

        return;
      }

      console.log("LOGIN ATTEMPT:", {
        entered: rawU,
        username,
        phone,
        staffUsers: APP_DATA.staffUsers,
        farmers: APP_DATA.agreements,
        customers: APP_DATA.dispatches
      });

      // ---------------------------------------------------
      // MASTER ADMIN
      // ---------------------------------------------------

      if (
        username === "admin" &&
        password === "Csetia@1122"
      ) {

        currentUser = {
          name: "Master Admin",
          username: "admin",
          role: "admin"
        };

        launchStaffPortal();
        return;
      }

      // ---------------------------------------------------
      // STAFF LOGIN
      // ---------------------------------------------------

      const staff =
        (APP_DATA.staffUsers || []).find((s) => {

          const savedUsername =
            normalizeUsername(s.username);

          const savedName =
            String(s.name || "")
              .trim()
              .toLowerCase();

          return (
            (
              savedUsername === username ||
              savedName === username
            ) &&
            String(s.password || "") === password
          );
        });

      if (staff) {

        currentUser = {
          name: staff.name,
          username: staff.username,
          role: "staff"
        };

        launchStaffPortal();
        return;
      }

      // ---------------------------------------------------
      // FARMER LOGIN
      // Username = Mobile
      // Password = Mobile
      // ---------------------------------------------------

      const farmer =
        (APP_DATA.agreements || []).find((a) => {

          return normalizePhone(a.phone) === phone;
        });

      if (
        farmer &&
        phone.length === 10 &&
        normalizePhone(password) === phone
      ) {

        currentPartySession = {
          role: "farmer",
          name: farmer.name,
          phone: phone
        };

        launchPartyPortal();
        return;
      }

      // ---------------------------------------------------
      // CUSTOMER LOGIN
      // Username = Mobile
      // Password = Mobile
      // ---------------------------------------------------

      const customer =
        (APP_DATA.dispatches || []).find((d) => {

          return normalizePhone(d.phone) === phone;
        });

      if (
        customer &&
        phone.length === 10 &&
        normalizePhone(password) === phone
      ) {

        currentPartySession = {
          role: "customer",
          name: customer.name,
          phone: phone
        };

        launchPartyPortal();
        return;
      }

      // ---------------------------------------------------
      // INVALID
      // ---------------------------------------------------

      alert(
        "❌ Invalid login details.\n\n" +
        "If this account was created on another phone, " +
        "make sure the account has been synced to Firebase."
      );

    } catch (error) {

      console.error("LOGIN ERROR:", error);

      alert(
        "❌ Login error:\n\n" +
        error.message
      );

    } finally {

      btn.innerText = "Sign In";
      btn.disabled = false;
    }
  }

  // ---------------------------------------------------------
  // STAFF ACCOUNT
  // ---------------------------------------------------------

  async function createStaffAccount(e) {

    e.preventDefault();

    const name =
      document.getElementById("staff-name").value.trim();

    const username =
      normalizeUsername(
        document.getElementById("staff-user").value
      );

    const password =
      document.getElementById("staff-pass").value.trim();

    if (!APP_DATA.staffUsers) {
      APP_DATA.staffUsers = [];
    }

    if (
      APP_DATA.staffUsers.some(
        s => normalizeUsername(s.username) === username
      )
    ) {

      alert("❌ Staff username already exists!");
      return;
    }

    APP_DATA.staffUsers.push({
      id: "staff_" + Date.now(),
      name: name,
      username: username,
      password: password,
      createdAt: new Date().toISOString()
    });

    const success = await saveData();

    if (success) {

      alert(
        `✅ Staff account @${username} created successfully!\n\n` +
        "This account is now stored in Firebase and can be used on another phone."
      );

      e.target.reset();
    }
  }

  // ---------------------------------------------------------
  // CUSTOMER
  // ---------------------------------------------------------

  async function generateCustomerSlip(e) {

    e.preventDefault();

    const name =
      document.getElementById("c-name").value.trim();

    const phone =
      normalizePhone(
        document.getElementById("c-phone").value
      );

    const vehicle =
      document.getElementById("c-vehicle").value.trim();

    const boxes =
      Number(
        document.getElementById("c-boxes").value || 0
      );

    const totalAmt =
      Number(
        document.getElementById("c-total-amt").value || 0
      );

    if (phone.length !== 10) {

      alert("Please enter a valid 10-digit mobile number.");
      return;
    }

    if (!APP_DATA.dispatches) {
      APP_DATA.dispatches = [];
    }

    APP_DATA.dispatches.push({

      id: "disp_" + Date.now(),

      name,
      phone,
      vehicle,
      boxes,
      totalAmt,

      date: todayDate(),

      createdAt: new Date().toISOString()
    });

    const success = await saveData();

    if (success) {

      alert(
        `✅ Customer ${name} registered successfully!\n\n` +
        `Login ID: ${phone}\n` +
        `Password: ${phone}`
      );

      e.target.reset();
    }
  }

  // ---------------------------------------------------------
  // FARMER
  // ---------------------------------------------------------

  async function generateFarmerSlip(e) {

    e.preventDefault();

    const name =
      document.getElementById("f-name").value.trim();

    const phone =
      normalizePhone(
        document.getElementById("f-phone").value
      );

    const village =
      document.getElementById("f-village").value.trim();

    if (phone.length !== 10) {

      alert("Please enter a valid 10-digit mobile number.");
      return;
    }

    if (!APP_DATA.agreements) {
      APP_DATA.agreements = [];
    }

    APP_DATA.agreements.push({

      id: "orch_" + Date.now(),

      name,
      phone,
      village,

      date: todayDate(),

      createdAt: new Date().toISOString()
    });

    const success = await saveData();

    if (success) {

      alert(
        `✅ Farmer ${name} registered successfully!\n\n` +
        `Login ID: ${phone}\n` +
        `Password: ${phone}`
      );

      e.target.reset();
    }
  }

  // ---------------------------------------------------------
  // INWARD
  // ---------------------------------------------------------

  async function generateDailyInwardSlip(e) {

    e.preventDefault();

    const name =
      document.getElementById("d-farmer").value.trim();

    const phone =
      normalizePhone(
        document.getElementById("d-phone").value
      );

    const vehicle =
      document.getElementById("d-vehicle").value.trim();

    const gross =
      Number(
        document.getElementById("d-gross-wt").value || 0
      );

    const tare =
      Number(
        document.getElementById("d-tare-wt").value || 0
      );

    const net =
      Math.max(0, gross - tare);

    if (!APP_DATA.inwards) {
      APP_DATA.inwards = [];
    }

    APP_DATA.inwards.push({

      id: "inw_" + Date.now(),

      name,
      phone,
      vehicle,
      gross,
      tare,
      net,

      date: todayDate(),

      createdAt: new Date().toISOString()
    });

    const success = await saveData();

    if (success) {

      alert(
        "✅ Inward slip saved and synced to Firebase!"
      );

      e.target.reset();
    }
  }

  // ---------------------------------------------------------
  // STAFF TABLE
  // ---------------------------------------------------------

  function renderStaffTable() {

    const tbody =
      document.getElementById("staff-table-body");

    if (!tbody) return;

    if (
      !APP_DATA.staffUsers ||
      APP_DATA.staffUsers.length === 0
    ) {

      tbody.innerHTML = `
        <tr>
          <td colspan="4"
              class="p-3 text-center text-gray-400">
            No staff accounts created yet.
          </td>
        </tr>
      `;

      return;
    }

    tbody.innerHTML =
      APP_DATA.staffUsers.map(s => `

        <tr class="border-b hover:bg-gray-50">

          <td class="p-2.5 font-bold">
            ${escapeHtml(s.name)}
          </td>

          <td class="p-2.5 font-mono text-amber-900">
            @${escapeHtml(s.username)}
          </td>

          <td class="p-2.5 font-mono text-gray-500">
            ${escapeHtml(s.password)}
          </td>

          <td class="p-2.5 text-right">

            <button
              onclick="deleteStaff('${s.id}')"
              class="text-red-600 font-bold text-xs">

              Delete

            </button>

          </td>

        </tr>

      `).join("");
  }

  async function deleteStaff(id) {

    if (!confirm("Delete this staff account?")) {
      return;
    }

    APP_DATA.staffUsers =
      (APP_DATA.staffUsers || [])
        .filter(x => x.id !== id);

    await saveData();
  }

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // ---------------------------------------------------------
  // DASHBOARD
  // ---------------------------------------------------------

  function renderDashboard() {

    const dateElement =
      document.getElementById("dash-date-filter");

    if (!dateElement) return;

    const today =
      dateElement.value || todayDate();

    const dayInwards =
      (APP_DATA.inwards || [])
        .filter(i => i.date === today);

    const dayDispatches =
      (APP_DATA.dispatches || [])
        .filter(d => d.date === today);

    const netWt =
      dayInwards.reduce(
        (a, b) => a + Number(b.net || 0),
        0
      );

    const boxes =
      dayDispatches.reduce(
        (a, b) => a + Number(b.boxes || 0),
        0
      );

    const sales =
      dayDispatches.reduce(
        (a, b) => a + Number(b.totalAmt || 0),
        0
      );

    document.getElementById(
      "stat-daily-weight"
    ).innerText =
      `${netWt.toLocaleString("en-IN")} Kg`;

    document.getElementById(
      "stat-daily-boxes"
    ).innerText =
      `${boxes.toLocaleString("en-IN")} Boxes`;

    document.getElementById(
      "stat-daily-cust-recv"
    ).innerText =
      `₹${sales.toLocaleString("en-IN")}`;
  }

  // ---------------------------------------------------------
  // STAFF PORTAL
  // ---------------------------------------------------------

  function launchStaffPortal() {

    document
      .getElementById("login-view")
      .classList.add("hidden");

    document
      .getElementById("party-portal-view")
      .classList.add("hidden");

    document
      .getElementById("app-view")
      .classList.remove("hidden");

    document
      .getElementById("user-display")
      .innerText =
      `${currentUser.name} (${currentUser.role.toUpperCase()})`;

    if (currentUser.role === "admin") {

      document
        .getElementById("tab-admin-panel")
        .classList.remove("hidden");

    } else {

      document
        .getElementById("tab-admin-panel")
        .classList.add("hidden");
    }

    switchTab("dashboard");
    renderDashboard();
  }

  // ---------------------------------------------------------
  // PARTY PORTAL
  // ---------------------------------------------------------

  function launchPartyPortal() {

    document
      .getElementById("login-view")
      .classList.add("hidden");

    document
      .getElementById("app-view")
      .classList.add("hidden");

    document
      .getElementById("party-portal-view")
      .classList.remove("hidden");

    document
      .getElementById("party-portal-name")
      .innerText =
      currentPartySession.name;

    document
      .getElementById("party-portal-phone")
      .innerText =
      `+91 ${currentPartySession.phone}`;

    document
      .getElementById("party-portal-type")
      .innerText =
      `${currentPartySession.role.toUpperCase()} PORTAL`;

    renderPartyPortal();
  }

  function renderPartyPortal() {

    if (!currentPartySession) return;

    const phone =
      normalizePhone(
        currentPartySession.phone
      );

    if (currentPartySession.role === "farmer") {

      const farmer =
        (APP_DATA.agreements || [])
          .find(a =>
            normalizePhone(a.phone) === phone
          );

      const inwards =
        (APP_DATA.inwards || [])
          .filter(i =>
            normalizePhone(i.phone) === phone
          );

      const kpi =
        document.getElementById(
          "party-portal-kpi-grid"
        );

      if (kpi) {

        const totalWeight =
          inwards.reduce(
            (sum, x) => sum + Number(x.net || 0),
            0
          );

        kpi.innerHTML = `

          <div class="bg-gray-50 p-3 rounded-xl">
            <div class="text-[10px] text-gray-500">
              INWARD RECORDS
            </div>
            <div class="font-black text-lg">
              ${inwards.length}
            </div>
          </div>

          <div class="bg-gray-50 p-3 rounded-xl">
            <div class="text-[10px] text-gray-500">
              TOTAL NET WEIGHT
            </div>
            <div class="font-black text-lg">
              ${totalWeight.toLocaleString("en-IN")} Kg
            </div>
          </div>

        `;
      }

      document.getElementById(
        "party-table-head"
      ).innerHTML = `
        <tr>
          <th class="p-2.5">Date</th>
          <th class="p-2.5">Vehicle</th>
          <th class="p-2.5">Gross</th>
          <th class="p-2.5">Tare</th>
          <th class="p-2.5">Net</th>
        </tr>
      `;

      document.getElementById(
        "party-table-body"
      ).innerHTML =
        inwards.map(i => `
          <tr class="border-b">
            <td class="p-2.5">${i.date}</td>
            <td class="p-2.5">${escapeHtml(i.vehicle)}</td>
            <td class="p-2.5">${i.gross} Kg</td>
            <td class="p-2.5">${i.tare} Kg</td>
            <td class="p-2.5 font-bold">${i.net} Kg</td>
          </tr>
        `).join("");

    } else {

      const dispatches =
        (APP_DATA.dispatches || [])
          .filter(d =>
            normalizePhone(d.phone) === phone
          );

      const totalBoxes =
        dispatches.reduce(
          (sum, x) => sum + Number(x.boxes || 0),
          0
        );

      const totalAmount =
        dispatches.reduce(
          (sum, x) => sum + Number(x.totalAmt || 0),
          0
        );

      document.getElementById(
        "party-portal-kpi-grid"
      ).innerHTML = `

        <div class="bg-gray-50 p-3 rounded-xl">
          <div class="text-[10px] text-gray-500">
            DISPATCHES
          </div>
          <div class="font-black text-lg">
            ${dispatches.length}
          </div>
        </div>

        <div class="bg-gray-50 p-3 rounded-xl">
          <div class="text-[10px] text-gray-500">
            TOTAL BOXES
          </div>
          <div class="font-black text-lg">
            ${totalBoxes.toLocaleString("en-IN")}
          </div>
        </div>

        <div class="bg-gray-50 p-3 rounded-xl">
          <div class="text-[10px] text-gray-500">
            TOTAL BILL
          </div>
          <div class="font-black text-lg">
            ₹${totalAmount.toLocaleString("en-IN")}
          </div>
        </div>

      `;

      document.getElementById(
        "party-table-head"
      ).innerHTML = `
        <tr>
          <th class="p-2.5">Date</th>
          <th class="p-2.5">Vehicle</th>
          <th class="p-2.5">Boxes</th>
          <th class="p-2.5">Amount</th>
        </tr>
      `;

      document.getElementById(
        "party-table-body"
      ).innerHTML =
        dispatches.map(d => `
          <tr class="border-b">
            <td class="p-2.5">${d.date}</td>
            <td class="p-2.5">${escapeHtml(d.vehicle)}</td>
            <td class="p-2.5 font-bold">${d.boxes}</td>
            <td class="p-2.5 font-bold">
              ₹${Number(d.totalAmt || 0).toLocaleString("en-IN")}
            </td>
          </tr>
        `).join("");
    }
  }

  // ---------------------------------------------------------
  // LOGOUT
  // ---------------------------------------------------------

  function logoutPortal() {

    currentUser = null;
    currentPartySession = null;

    document
      .getElementById("app-view")
      .classList.add("hidden");

    document
      .getElementById("party-portal-view")
      .classList.add("hidden");

    document
      .getElementById("login-view")
      .classList.remove("hidden");

    document.getElementById("login-user").value = "";
    document.getElementById("login-pass").value = "";
  }

  // ---------------------------------------------------------
  // TABS
  // ---------------------------------------------------------

  function switchTab(tab) {

    [
      "dashboard",
      "customer-ledger",
      "orchards",
      "farmer",
      "daily",
      "customer",
      "attendance",
      "admin-panel"
    ].forEach(t => {

      const sec =
        document.getElementById(`${t}-section`);

      const btn =
        document.getElementById(`tab-${t}`);

      if (sec) {
        sec.classList.add("hidden");
      }

      if (btn) {
        btn.className =
          "py-2.5 text-gray-500 hover:text-amber-700 font-bold";
      }
    });

    const activeSec =
      document.getElementById(`${tab}-section`);

    const activeBtn =
      document.getElementById(`tab-${tab}`);

    if (activeSec) {
      activeSec.classList.remove("hidden");
    }

    if (activeBtn) {
      activeBtn.className =
        "py-2.5 border-b-2 border-amber-600 text-amber-700 font-black";
    }
  }

  // ---------------------------------------------------------
  // DATE
  // ---------------------------------------------------------

  function resetToToday() {

    const el =
      document.getElementById("dash-date-filter");

    if (!el) return;

    el.value = todayDate();

    renderDashboard();
  }

  // ---------------------------------------------------------
  // START APPLICATION
  // ---------------------------------------------------------

  window.onload = async function() {

    // Load local backup first
    const saved =
      localStorage.getItem(
        "SETIA_WAXING_PORTAL_V10"
      );

    if (saved) {

      try {

        APP_DATA = Object.assign(
          APP_DATA,
          JSON.parse(saved)
        );

      } catch (error) {

        console.warn(
          "Local data could not be loaded",
          error
        );
      }
    }

    // Logo
    const logoSvg =
      document.getElementById(
        "plant-logo-svg"
      ).innerHTML;

    document.getElementById(
      "login-logo-container"
    ).innerHTML = logoSvg;

    document.getElementById(
      "header-logo-container"
    ).innerHTML = logoSvg;

    document.getElementById(
      "party-logo-container"
    ).innerHTML = logoSvg;

    resetToToday();

    // Connect to cloud
    await loadCloudData();

    // Start real-time listener
    setupCloudListeners();

    renderDashboard();
    renderStaffTable();
  };
